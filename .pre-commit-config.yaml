---
# Pre-commit hook configuration.
# Install hooks: pre-commit install
# Run manually: pre-commit run --all-files
#
# Required tools (must be in PATH):
#   terraform, tflint, ansible-lint, yamllint, gitleaks
#
# Install: pip install pre-commit  |  brew install pre-commit
# Then:    pre-commit install

repos:
  # ---- General hygiene -----------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
        # ansible-lint validates Ansible YAML more thoroughly;
        # exclude its directories to avoid duplicate/conflicting errors.
        exclude: ^ansible/

  # ---- Terraform -----------------------------------------------------------
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.96.1
    hooks:
      - id: terraform_fmt
        args: [--args=-recursive]
      - id: terraform_tflint
        args:
          - --args=--config=__GIT_WORKING_DIR__/.tflint.hcl

  # ---- Ansible -------------------------------------------------------------
  - repo: https://github.com/ansible/ansible-lint
    rev: v24.9.2
    hooks:
      - id: ansible-lint
        # Only run on Ansible YAML files; skip Terraform templates.
        files: ^ansible/

  # ---- YAML ----------------------------------------------------------------
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        # Exclude Ansible files (ansible-lint handles those)
        # and Terraform templates (not valid YAML).
        exclude: >
          (?x)^(
            ansible/|
            terraform/.*\.tftpl$
          )

  # ---- Secret scanning -----------------------------------------------------
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.1
    hooks:
      - id: gitleaks
