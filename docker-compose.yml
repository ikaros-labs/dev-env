services:
  # Tailscale sidecar — provides network access to managed servers.
  # The tools container shares this network namespace so Ansible SSH
  # traffic flows through the tailscale0 interface automatically.
  tailscale:
    image: tailscale/tailscale:latest
    cap_add: [NET_ADMIN, SYS_MODULE]
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      TS_AUTHKEY: "${TAILSCALE_OPS_AUTH_KEY}"
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
      TS_HOSTNAME: "ops-tools"
      TS_EXTRA_ARGS: ""
    volumes:
      - tailscale-state:/var/lib/tailscale
    healthcheck:
      test: ["CMD", "tailscale", "status"]
      interval: 5s
      timeout: 10s
      retries: 12

  tools:
    build: .
    # Share the Tailscale container's network namespace so this container
    # can reach managed servers over the tailnet.
    network_mode: service:tailscale
    depends_on:
      tailscale:
        condition: service_healthy
    # Pass all .env variables into the container.  Ansible reads secrets
    # directly from the environment via lookup('env', ...) in env_vars.yml.
    env_file: .env
    environment:
      # Remap .env names to TF_VAR_ names Terraform expects.
      TF_VAR_hcloud_token: "${HCLOUD_TOKEN:-}"
      TF_VAR_do_token: "${DO_TOKEN:-}"
      TF_VAR_do_project_id: "${DO_PROJECT_ID:-}"
      TF_VAR_tailscale_auth_key: "${TAILSCALE_SERVER_AUTH_KEY}"
      TF_VAR_user_password: "${USER_PASSWORD}"
      TF_VAR_username: "${USERNAME:-ikaros}"
      TF_VAR_servers: "${SERVERS:-}"
      # gen-inventory.sh reads ANSIBLE_USER for the inventory fallback.
      ANSIBLE_USER: "${USERNAME:-ikaros}"
    volumes:
      - .:/workspace
      - tf-plugin-cache:/root/.terraform.d/plugin-cache
      - ansible-collections:/workspace/ansible/collections
    stdin_open: true
    tty: true
    command: ["bash"]

volumes:
  tailscale-state:
  tf-plugin-cache:
  ansible-collections:
