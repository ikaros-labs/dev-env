[defaults]
inventory          = hosts.ini
local_tmp          = /tmp/ansible-local
roles_path         = roles/
# Project-local collection path — searched before ~/.ansible/collections so
# the pins in requirements.yml win over any stale globally-installed copy.
# Populate with: ansible-galaxy collection install -r requirements.yml
collections_path   = ./collections

# host_key_checking is disabled because all connections go through Tailscale,
# which provides its own mutual identity verification at the network layer.
# Traditional SSH host-key trust is superseded by the tailnet membership check.
host_key_checking  = False
stdout_callback    = ansible.builtin.default
result_format      = yaml
bin_ansible_callbacks = True

# Mitogen maintains a persistent Python interpreter on the remote host,
# replacing the default SSH+copy+execute-per-task model.
strategy_plugins = /usr/local/lib/python3.12/dist-packages/mitogen/ansible_mitogen/plugins/strategy
strategy = mitogen_linear
forks = 20
fact_caching = jsonfile
fact_caching_connection = .fact_cache
fact_caching_timeout = 86400

[privilege_escalation]
become        = True
become_method = sudo
# ansible_become_pass is provided via environment variable (USER_PASSWORD in .env).

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o ConnectTimeout=30
