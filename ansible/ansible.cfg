[defaults]
inventory          = inventory/
local_tmp          = /tmp/ansible-local
roles_path         = roles/
# Project-local collection path — searched before ~/.ansible/collections so
# the pins in requirements.yml win over any stale globally-installed copy.
# Populate with: ansible-galaxy collection install -r requirements.yml
collections_path   = ./collections
vault_password_file = ~/.ansible_vault_pass

# host_key_checking is disabled because all connections go through Tailscale,
# which provides its own mutual identity verification at the network layer.
# Traditional SSH host-key trust is superseded by the tailnet membership check.
host_key_checking  = False
stdout_callback    = yaml
bin_ansible_callbacks = True

[privilege_escalation]
become        = True
become_method = sudo
# ansible_become_pass is provided via Ansible Vault (inventory/group_vars/all/vault.yml).

[ssh_connection]
# Use persistent SSH connections for speed; Tailscale handles keep-alive.
pipelining = True
