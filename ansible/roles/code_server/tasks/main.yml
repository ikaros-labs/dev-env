---
- name: Install code-server via official install script
  ansible.builtin.shell:
    cmd: curl -fsSL https://code-server.dev/install.sh | sh
    creates: /usr/bin/code-server
  become: true

- name: Create code-server config directory
  ansible.builtin.file:
    path: /home/{{ ansible_user }}/.config/code-server
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0700"

- name: Deploy code-server config
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /home/{{ ansible_user }}/.config/code-server/config.yaml
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"
  notify: Restart code-server

- name: Enable and start code-server service
  ansible.builtin.systemd:
    name: code-server@{{ ansible_user }}
    enabled: true
    state: started
    daemon_reload: true
  become: true

- name: Deploy Caddy site config for code-server
  ansible.builtin.template:
    src: caddy.conf.j2
    dest: /etc/caddy/sites.d/code.caddy
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Reload caddy config

- name: Deploy CoreDNS config for code-server
  ansible.builtin.template:
    src: coredns.conf.j2
    dest: /etc/coredns/conf.d/code.conf
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart coredns
