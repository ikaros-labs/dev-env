---
- name: Add NodeSource GPG key
  ansible.builtin.get_url:
    url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    dest: /etc/apt/keyrings/nodesource.asc
    mode: "0644"
  become: true

- name: Add NodeSource apt repository (Node.js 22 LTS)
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch=amd64 signed-by=/etc/apt/keyrings/nodesource.asc]
      https://deb.nodesource.com/node_22.x nodistro main
    filename: nodesource
    state: present
  become: true

- name: Install Node.js, jq, and musl packages
  ansible.builtin.apt:
    name:
      - nodejs
      - jq
      - musl
      - musl-tools
    state: present
    update_cache: true
  become: true

- name: Install bun globally via npm
  ansible.builtin.command:
    cmd: npm install -g bun
    creates: /usr/bin/bun
  become: true
