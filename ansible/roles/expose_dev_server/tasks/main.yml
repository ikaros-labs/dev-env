---
- name: Install at scheduler
  ansible.builtin.apt:
    name: at
    state: present
  become: true

- name: Ensure atd is enabled and running
  ansible.builtin.systemd:
    name: atd
    enabled: true
    state: started
  become: true

- name: Clone expose-dev-server repository
  ansible.builtin.git:
    repo: https://github.com/ikaros-labs/expose-dev-server
    dest: /home/{{ ansible_user }}/expose-dev-server
    version: main
    update: true
  become: true
  become_user: "{{ ansible_user }}"
  register: expose_dev_server_repo

- name: Check if skill is already installed
  ansible.builtin.stat:
    path: /home/{{ ansible_user }}/.claude/skills/expose-dev-server
  register: expose_dev_server_skill

- name: Install expose-dev-server skill and CLI tools via Makefile
  ansible.builtin.command:
    cmd: make install DOMAIN=demo.{{ domain }}
    chdir: /home/{{ ansible_user }}/expose-dev-server
  become: true
  become_user: "{{ ansible_user }}"
  when: expose_dev_server_repo.changed or not expose_dev_server_skill.stat.exists

- name: Deploy ~/.local/bin PATH fragment
  ansible.builtin.copy:
    src: zshrc.d/local-bin.zsh
    dest: /home/{{ ansible_user }}/.zshrc.d/local-bin.zsh
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"

- name: Deploy CoreDNS config for demo zone
  ansible.builtin.template:
    src: coredns.conf.j2
    dest: /opt/coredns/conf.d/demo.conf
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart coredns

- name: Deploy demo zone file
  ansible.builtin.template:
    src: demo.zone.j2
    dest: "/opt/coredns/zones/demo.{{ domain }}"
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart coredns
