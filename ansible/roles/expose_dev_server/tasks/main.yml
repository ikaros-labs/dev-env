---
- name: Install at scheduler
  ansible.builtin.apt:
    name: at
    state: present
  become: true

- name: Ensure atd is enabled and running
  ansible.builtin.systemd:
    name: atd
    enabled: true
    state: started
  become: true

- name: Clone expose-dev-server repository
  ansible.builtin.git:
    repo: https://github.com/ikaros-labs/expose-dev-server
    dest: /home/{{ ansible_user }}/expose-dev-server
    version: main
    update: true
  become: true
  become_user: "{{ ansible_user }}"
  register: expose_dev_server_repo

- name: Check expose-dev-server domain config file
  ansible.builtin.stat:
    path: /home/{{ ansible_user }}/.config/expose-dev-server/domain
  register: expose_domain_file

- name: Read expose-dev-server domain config
  ansible.builtin.slurp:
    src: /home/{{ ansible_user }}/.config/expose-dev-server/domain
  register: expose_domain_content
  when: expose_domain_file.stat.exists

- name: Install expose-dev-server skill and CLI tools via Makefile
  ansible.builtin.command:
    cmd: make install DOMAIN=demo.{{ domain }}
    chdir: /home/{{ ansible_user }}/expose-dev-server
  when: >-
    expose_dev_server_repo.changed or
    not expose_domain_file.stat.exists or
    (expose_domain_content.content | default('') | b64decode | trim) != 'demo.' + domain

- name: Deploy ~/.local/bin PATH fragment
  ansible.builtin.copy:
    src: zshrc.d/local-bin.zsh
    dest: /home/{{ ansible_user }}/.zshrc.d/local-bin.zsh
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"

- name: Ensure /etc/caddy/demo-sites.d directory exists
  ansible.builtin.file:
    path: /etc/caddy/demo-sites.d
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  become: true

- name: Deploy Caddy wildcard config for demo subdomain
  ansible.builtin.template:
    src: caddy.conf.j2
    dest: /etc/caddy/sites.d/demo.caddy
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Reload caddy config

- name: Deploy CoreDNS config for demo zone
  ansible.builtin.template:
    src: coredns.conf.j2
    dest: /etc/coredns/conf.d/demo.conf
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart coredns

- name: Deploy demo zone file
  ansible.builtin.template:
    src: demo.zone.j2
    dest: "/etc/coredns/zones/demo.{{ domain }}"
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart coredns
