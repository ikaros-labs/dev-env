---
- name: Install at scheduler
  ansible.builtin.apt:
    name: at
    state: present
  become: true

- name: Ensure atd is enabled and running
  ansible.builtin.systemd:
    name: atd
    enabled: true
    state: started
  become: true

- name: Clone expose-dev-server repository
  ansible.builtin.git:
    repo: https://github.com/ikaros-labs/expose-dev-server
    dest: /home/{{ ansible_user }}/expose-dev-server
    version: main
    update: true
  become: true
  become_user: "{{ ansible_user }}"

- name: Install expose-dev-server skill and CLI tools via Makefile
  ansible.builtin.command:
    cmd: make install DOMAIN=demo.{{ domain }}
    chdir: /home/{{ ansible_user }}/expose-dev-server
  become: true
  become_user: "{{ ansible_user }}"
  changed_when: false

- name: Deploy ~/.local/bin PATH fragment
  ansible.builtin.copy:
    src: zshrc.d/local-bin.zsh
    dest: /home/{{ ansible_user }}/.zshrc.d/local-bin.zsh
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
  become: true
