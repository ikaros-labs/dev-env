---
- name: Create coredns system user
  ansible.builtin.user:
    name: coredns
    system: true
    shell: /usr/sbin/nologin
    home: /nonexistent
    create_home: false
  become: true

- name: Create CoreDNS config directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /etc/coredns/conf.d
    - /etc/coredns/zones
  become: true

- name: Download CoreDNS release tarball
  ansible.builtin.get_url:
    url: "https://github.com/coredns/coredns/releases/download/v{{ coredns_version }}/coredns_{{ coredns_version }}_linux_amd64.tgz"
    dest: "/tmp/coredns_{{ coredns_version }}.tgz"
    checksum: "sha256:{{ coredns_sha256 }}"
    mode: "0644"
  become: true
  register: coredns_download

- name: Extract CoreDNS binary
  ansible.builtin.unarchive:
    src: "/tmp/coredns_{{ coredns_version }}.tgz"
    dest: /usr/local/bin/
    remote_src: true
    include:
      - coredns
    mode: "0755"
    owner: root
    group: root
  become: true
  when: coredns_download.changed
  notify: Restart coredns

- name: Check CoreDNS binary capabilities
  ansible.builtin.command:
    cmd: getcap /usr/local/bin/coredns
  register: coredns_caps
  changed_when: false

- name: Grant CAP_NET_BIND_SERVICE to CoreDNS binary
  ansible.builtin.command:
    cmd: setcap cap_net_bind_service=+ep /usr/local/bin/coredns
  become: true
  when: "'cap_net_bind_service=ep' not in coredns_caps.stdout"
  notify: Restart coredns

- name: Deploy Corefile
  ansible.builtin.template:
    src: Corefile.j2
    dest: /etc/coredns/Corefile
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart coredns

- name: Deploy coredns systemd unit
  ansible.builtin.template:
    src: coredns.service.j2
    dest: /etc/systemd/system/coredns.service
    owner: root
    group: root
    mode: "0644"
  become: true
  notify:
    - Reload systemd daemon
    - Restart coredns

- name: Disable systemd-resolved stub listener
  ansible.builtin.copy:
    dest: /etc/systemd/resolved.conf.d/no-stub.conf
    content: |
      [Resolve]
      DNSStubListener=no
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart systemd-resolved

- name: Configure /etc/resolv.conf to use CoreDNS
  ansible.builtin.copy:
    dest: /etc/resolv.conf
    content: |
      nameserver 127.0.0.1
      options edns0 trust-ad
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Flush handlers before starting service
  ansible.builtin.meta: flush_handlers

- name: Ensure coredns service is enabled and running
  ansible.builtin.systemd:
    name: coredns
    enabled: true
    state: started
    daemon_reload: false
  become: true
