---
- name: Get Tailscale IPv4 address
  ansible.builtin.command: tailscale ip -4
  changed_when: false
  register: tailscale_ip_result
  become: true

- name: Set tailscale_ip fact
  ansible.builtin.set_fact:
    tailscale_ip: "{{ tailscale_ip_result.stdout | trim }}"

- name: Create CoreDNS deployment directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /opt/coredns/conf.d
    - /opt/coredns/zones
  become: true

- name: Deploy docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /opt/coredns/docker-compose.yml
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart coredns

- name: Deploy Corefile
  ansible.builtin.template:
    src: Corefile.j2
    dest: /opt/coredns/Corefile
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart coredns

- name: Deploy coredns systemd unit
  ansible.builtin.template:
    src: coredns.service.j2
    dest: /etc/systemd/system/coredns.service
    owner: root
    group: root
    mode: "0644"
  become: true
  notify:
    - Reload systemd daemon
    - Restart coredns

- name: Ensure coredns service is enabled and running
  ansible.builtin.systemd:
    name: coredns
    enabled: true
    state: started
    daemon_reload: false
  become: true
