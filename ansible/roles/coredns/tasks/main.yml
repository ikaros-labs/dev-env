---
- name: Create coredns system user
  ansible.builtin.user:
    name: coredns
    system: true
    shell: /usr/sbin/nologin
    home: /nonexistent
    create_home: false
  become: true

- name: Create CoreDNS config directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /etc/coredns/conf.d
    - /etc/coredns/zones
  become: true

- name: Download CoreDNS release tarball
  ansible.builtin.get_url:
    url: "https://github.com/coredns/coredns/releases/download/v{{ coredns_version }}/coredns_{{ coredns_version }}_linux_amd64.tgz"
    dest: "/tmp/coredns_{{ coredns_version }}.tgz"
    checksum: "sha256:{{ coredns_sha256 }}"
    mode: "0644"
  become: true
  register: coredns_download

- name: Extract CoreDNS binary
  ansible.builtin.unarchive:
    src: "/tmp/coredns_{{ coredns_version }}.tgz"
    dest: /usr/local/bin/
    remote_src: true
    include:
      - coredns
    mode: "0755"
    owner: root
    group: root
  become: true
  when: coredns_download.changed
  notify: Restart coredns

- name: Deploy Corefile
  ansible.builtin.template:
    src: Corefile.j2
    dest: /etc/coredns/Corefile
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart coredns

- name: Deploy coredns systemd unit
  ansible.builtin.template:
    src: coredns.service.j2
    dest: /etc/systemd/system/coredns.service
    owner: root
    group: root
    mode: "0644"
  become: true
  notify:
    - Reload systemd daemon
    - Restart coredns

- name: Ensure coredns service is enabled and running
  ansible.builtin.systemd:
    name: coredns
    enabled: true
    state: started
    daemon_reload: false
  become: true
