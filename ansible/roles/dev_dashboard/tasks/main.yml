---
- name: Clone dev-dashboard repository
  ansible.builtin.git:
    repo: https://github.com/ikaros-labs/dev-dashboard
    dest: /home/{{ ansible_user }}/dev-dashboard
    version: main
    update: true
  become: true
  become_user: "{{ ansible_user }}"
  notify: Restart dev-dashboard

- name: Install dev-dashboard dependencies
  ansible.builtin.command:
    cmd: /usr/local/bin/bun install --frozen-lockfile
    chdir: /home/{{ ansible_user }}/dev-dashboard
  become: true
  become_user: "{{ ansible_user }}"
  changed_when: false

- name: Deploy dev-dashboard environment file
  ansible.builtin.template:
    src: .env.j2
    dest: /home/{{ ansible_user }}/dev-dashboard/.env
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"
  notify: Restart dev-dashboard

- name: Deploy dev-dashboard systemd unit
  ansible.builtin.template:
    src: dev-dashboard.service.j2
    dest: /etc/systemd/system/dev-dashboard.service
    owner: root
    group: root
    mode: "0644"
  become: true
  notify:
    - Reload systemd daemon
    - Restart dev-dashboard

- name: Ensure dev-dashboard service is enabled and running
  ansible.builtin.systemd:
    name: dev-dashboard
    enabled: true
    state: started
    daemon_reload: false
  become: true

- name: Deploy Caddy site config for dev-dashboard
  ansible.builtin.template:
    src: caddy.conf.j2
    dest: /etc/caddy/sites.d/dashboard.caddy
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Reload caddy config

- name: Deploy CoreDNS config for dev-dashboard
  ansible.builtin.template:
    src: coredns.conf.j2
    dest: /etc/coredns/conf.d/dashboard.conf
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart coredns
