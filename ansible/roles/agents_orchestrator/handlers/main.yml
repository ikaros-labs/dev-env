---
- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true
  become: true

- name: Restart agents-orchestrator
  ansible.builtin.systemd:
    name: agents-orchestrator
    state: restarted
  become: true

- name: Restart coredns
  ansible.builtin.systemd:
    name: coredns
    state: restarted
  become: true
