---
- name: Install Docker prerequisite packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
  become: true

- name: Add Docker GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
  become: true

- name: Add Docker apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu {{ ansible_facts['distribution_release'] }} stable
    filename: docker
    state: present
  become: true

- name: Install Docker Engine and rootless extras
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
      - docker-ce-rootless-extras
      - uidmap
      - dbus-user-session
    state: present
    update_cache: true
  become: true

- name: Look up UID for {{ ansible_user }}
  ansible.builtin.command:
    cmd: id -u {{ ansible_user }}
  register: docker_user_uid
  changed_when: false

- name: Disable and stop rootful Docker service
  ansible.builtin.systemd:
    name: docker
    enabled: false
    state: stopped
  become: true

- name: Disable and stop rootful Docker socket
  ansible.builtin.systemd:
    name: docker.socket
    enabled: false
    state: stopped
  become: true

- name: Enable lingering for {{ ansible_user }}
  ansible.builtin.command:
    cmd: loginctl enable-linger {{ ansible_user }}
    creates: /var/lib/systemd/linger/{{ ansible_user }}
  become: true

- name: Check if rootless Docker is already installed
  ansible.builtin.stat:
    path: /home/{{ ansible_user }}/.config/systemd/user/docker.service
  register: rootless_docker_unit

- name: Install rootless Docker
  ansible.builtin.command:
    cmd: dockerd-rootless-setuptool.sh install --force
  when: not rootless_docker_unit.stat.exists
  become: true
  become_user: "{{ ansible_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ docker_user_uid.stdout }}"
    HOME: "/home/{{ ansible_user }}"

- name: Enable and start rootless Docker user service
  ansible.builtin.systemd:
    name: docker
    scope: user
    enabled: true
    state: started
  become: true
  become_user: "{{ ansible_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ docker_user_uid.stdout }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ docker_user_uid.stdout }}/bus"
