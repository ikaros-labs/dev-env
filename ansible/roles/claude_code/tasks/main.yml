---
- name: Install Claude Code via official install script
  ansible.builtin.shell:
    cmd: curl -fsSL https://claude.ai/install.sh | bash
    creates: ~/.local/bin/claude

- name: Manage CLAUDE_CODE_OAUTH_TOKEN in /etc/environment
  ansible.builtin.lineinfile:
    path: /etc/environment
    regexp: '^CLAUDE_CODE_OAUTH_TOKEN='
    line: "CLAUDE_CODE_OAUTH_TOKEN={{ claude_oauth_token | default('') }}"
    state: "{{ 'present' if (claude_oauth_token is defined and claude_oauth_token | length > 0) else 'absent' }}"
  become: true
