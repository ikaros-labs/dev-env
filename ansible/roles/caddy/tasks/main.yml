---
- name: Get Tailscale IPv4 address
  ansible.builtin.command: tailscale ip -4
  changed_when: false
  register: tailscale_ip_result
  become: true

- name: Set tailscale_ip fact
  ansible.builtin.set_fact:
    tailscale_ip: "{{ tailscale_ip_result.stdout | trim }}"

- name: Determine if Cloudflare DNS challenge is available
  ansible.builtin.set_fact:
    caddy_dns_challenge: "{{ caddy_cf_api_token | default('') | length > 0 }}"

- name: Create Caddy deployment directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /opt/caddy
    - /opt/caddy/sites.d
  become: true

- name: Create demo-sites.d directory ({{ ansible_user }}-writable)
  ansible.builtin.file:
    path: /opt/caddy/demo-sites.d
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  become: true

- name: Deploy Dockerfile
  ansible.builtin.copy:
    src: Dockerfile
    dest: /opt/caddy/Dockerfile
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart caddy

- name: Deploy docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /opt/caddy/docker-compose.yml
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart caddy

- name: Deploy Caddyfile
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: /opt/caddy/Caddyfile
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Reload caddy config

- name: Deploy agents-new site config
  ansible.builtin.template:
    src: sites.d/agents-new.caddy.j2
    dest: "/opt/caddy/sites.d/agents-new.{{ domain }}.caddy"
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Reload caddy config

- name: Deploy caddy environment file
  ansible.builtin.template:
    src: caddy.env.j2
    dest: /opt/caddy/.env
    owner: root
    group: root
    mode: "0600"
  become: true
  notify: Restart caddy
  when: caddy_dns_challenge

- name: Deploy empty caddy environment file (no DNS challenge)
  ansible.builtin.copy:
    content: ""
    dest: /opt/caddy/.env
    owner: root
    group: root
    mode: "0600"
  become: true
  notify: Restart caddy
  when: not caddy_dns_challenge

# Always run — Docker layer cache makes this a no-op when nothing changed.
# Must happen before the systemd "ensure started" task below.
- name: Build caddy Docker image
  ansible.builtin.command:
    cmd: docker compose build
    chdir: /opt/caddy
  become: true
  changed_when: false

- name: Deploy caddy systemd unit
  ansible.builtin.template:
    src: caddy.service.j2
    dest: /etc/systemd/system/caddy.service
    owner: root
    group: root
    mode: "0644"
  become: true
  notify:
    - Reload systemd daemon
    - Restart caddy

- name: Ensure caddy service is enabled and running
  ansible.builtin.systemd:
    name: caddy
    enabled: true
    state: started
    daemon_reload: false
  become: true

- name: Deploy caddy-reload convenience script
  ansible.builtin.copy:
    src: caddy-reload
    dest: /usr/local/bin/caddy-reload
    owner: root
    group: root
    mode: "0755"
  become: true
