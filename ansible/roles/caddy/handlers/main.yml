---
- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true
  become: true

- name: Restart caddy
  ansible.builtin.systemd:
    name: caddy
    state: restarted
  become: true

- name: Reload caddy config
  ansible.builtin.systemd:
    name: caddy
    state: reloaded
  become: true
