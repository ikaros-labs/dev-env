---
# setup.yml — converge all managed hosts.
#
# Run with:
#   ansible-playbook playbooks/setup.yml
#
# Secrets (sudo password, API tokens) are in Ansible Vault-encrypted
# inventory/group_vars files.  The vault password file is configured in ansible.cfg.
#
# The inventory is generated from Terraform outputs; run
# scripts/gen-inventory.sh after `terraform apply` to refresh it.

- name: Setup dev envs
  hosts: all
  gather_facts: true
  roles:
    - role: common
    - role: unattended_upgrades
    - role: docker
    - role: github_cli
    - role: node_tooling
    - role: zsh_config
    - role: git_config
    - role: claude_code
    - role: playwright
    - role: ansible_tool
    - role: terraform
    - role: caddy
    - role: expose_dev_server
    - role: code_server
    - role: coredns
    - role: agents_orchestrator
