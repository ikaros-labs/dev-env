---
# setup.yml — converge all managed hosts.
#
# Run with:
#   ansible-playbook playbooks/setup.yml
#
# Secrets (sudo password, API tokens) are read from environment variables
# sourced from the root .env file.  See env_vars.yml for the mapping.
#
# The inventory is generated from Terraform outputs; run
# scripts/gen-inventory.sh after `terraform apply` to refresh it.

- name: Setup dev envs
  hosts: all
  gather_facts: true
  gather_subset:
    - "!all"
    - "!min"
    - distribution
  vars_files:
    - ../env_vars.yml
  roles:
    - role: common
      tags: common
    - role: unattended_upgrades
      tags: unattended_upgrades
    - role: docker
      tags: docker
    - role: github_cli
      tags: github_cli
    - role: node_tooling
      tags: node_tooling
    - role: zsh_config
      tags: zsh_config
    - role: git_config
      tags: git_config
    - role: claude_code
      tags: claude_code
    - role: playwright
      tags: playwright
    # - role: ansible_tool
    #   tags: ansible_tool
    # - role: terraform
    #   tags: terraform
    - role: caddy
      tags: caddy
    - role: coredns
      tags: coredns
    - role: expose_dev_server
      tags: expose_dev_server
    - role: code_server
      tags: code_server
    - role: ttyd
      tags: ttyd
    - role: agents_orchestrator
      tags: agents_orchestrator
